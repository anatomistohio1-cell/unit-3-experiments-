<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML5 Input Types</title>
    <link rel="stylesheet" href="unit3exp3.css">
</head>
<body>
    <main>
        <h1>HTML5 Input Types</h1>
        <form id="form">
            <label>Email <input type="email" name="email" required></label>
            <label>Website <input type="url" name="website"></label>
            <label>Phone <input type="tel" name="phone"></label>
            <label>Date <input type="date" name="date"></label>
            <label>Quantity <input type="number" name="quantity" min="1" max="10"></label>
            <button type="submit">Submit</button>
            <output id="result" aria-live="polite"></output>
        </form>
    </main>

    <script>
        document.querySelector("#form").addEventListener("submit", (event) => {
            event.preventDefault();
            document.querySelector("#result").textContent = "Form submitted!";
        });
    </script>
</body>
</html>
